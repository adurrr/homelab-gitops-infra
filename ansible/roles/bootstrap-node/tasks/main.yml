---
# =============================================================================
# Role: bootstrap-node
# =============================================================================
# Configures kernel modules, sysctl parameters, and OS prerequisites
# for K3s and Cilium on aarch64 and x86_64 nodes.
# =============================================================================

- name: Update package cache (Debian/Ubuntu)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"
  changed_when: false

- name: Install required system packages
  ansible.builtin.package:
    name:
      - curl
      - wget
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - conntrack
      - socat
      - ipvsadm
      - apparmor
      - apparmor-utils
    state: present
  when: ansible_os_family == "Debian"

- name: Install required system packages (Red Hat)
  ansible.builtin.package:
    name:
      - curl
      - wget
      - conntrack-tools
      - socat
      - ipvsadm
    state: present
  when: ansible_os_family == "RedHat"

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ required_kernel_modules }}"

- name: Persist kernel modules
  ansible.builtin.copy:
    content: "{{ item }}"
    dest: "/etc/modules-load.d/{{ item }}.conf"
    mode: "0644"
  loop: "{{ required_kernel_modules }}"
  when: kernel_modules_persist

- name: Configure sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ required_sysctl }}"

- name: Disable swap (required by Kubernetes)
  ansible.builtin.command: swapoff -a
  changed_when: ansible_swaptotal_mb > 0

- name: Remove swap from fstab
  ansible.posix.mount:
    name: swap
    fstype: swap
    state: absent

- name: Create tools checksum directory
  ansible.builtin.file:
    path: "{{ tools_checksum_dir }}"
    state: directory
    mode: "0755"

- name: Display architecture info
  ansible.builtin.debug:
    msg: |
      Node: {{ inventory_hostname }}
      Architecture: {{ ansible_architecture }} (mapped to: {{ architecture_map[ansible_architecture] }})
      OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
      Kernel: {{ ansible_kernel }}
      Memory: {{ ansible_memtotal_mb }} MB
      CPUs: {{ ansible_processor_vcpus }}

# =============================================================================
# tmpfs /run sizing (Layer 1 of /run space fix)
# =============================================================================
- name: Ensure tmp.mount.d directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/tmp.mount.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [tmpfs, kernel, bootstrap]

- name: Render systemd tmp.mount drop-in for /run size override
  ansible.builtin.template:
    src: tmp.mount.override.conf.j2
    dest: /etc/systemd/system/tmp.mount.d/override.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: [tmpfs, kernel, bootstrap]

- name: Reload systemd to pick up tmp.mount drop-in
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  tags: [tmpfs, kernel, bootstrap]

# ansible-lint: command-instead-of-module is silenced here because
# ansible.posix.mount does not support clean remount of tmpfs.
# `mount -o remount /run` is the canonical Linux invocation; failure
# (e.g. EBUSY) is non-fatal and the new size applies on next boot anyway.
- name: Remount /run to apply new size immediately  # noqa: command-instead-of-module
  ansible.builtin.command: mount -o remount /run
  become: true
  changed_when: true
  failed_when: false
  register: run_remount
  tags: [tmpfs, kernel, bootstrap]

# =============================================================================
# K3s kubelet config - reduced pod shm size (Layer 2 of /run space fix)
# =============================================================================
- name: Ensure /etc/rancher/k3s directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: ansible_os_family in ['Debian', 'RedHat']
  tags: [k3s, kernel, bootstrap]

- name: Render K3s config.yaml with kubelet-arg pod-shm-size
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  become: true
  when: ansible_os_family in ['Debian', 'RedHat']
  register: k3s_config_rendered
  tags: [k3s, kernel, bootstrap]

- name: Warn that k3s service restart is required to apply kubelet-arg
  ansible.builtin.debug:
    msg: >-
      K3s config.yaml was rendered to /etc/rancher/k3s/config.yaml.
      Restart K3s to apply pod-shm-size: drain the node first
      (kubectl drain <node> --ignore-daemonsets --delete-emptydir-data),
      then systemctl restart k3s (server) or k3s-agent (agent),
      then kubectl uncordon <node>.
  when:
    - ansible_os_family in ['Debian', 'RedHat']
    - k3s_config_rendered is changed
  tags: [k3s, kernel, bootstrap]
