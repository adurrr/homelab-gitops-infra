# =============================================================================
# Homelab GitOps Infrastructure: kube-prometheus-stack Values
# =============================================================================
# Prometheus + Grafana + Alertmanager for the 2-node ARM64 homelab cluster.
# Reference: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
# Chart version: 86.3.1
# (reconciled from installed chart label app.kubernetes.io/version: 86.3.1;
#  prior comment said 85.2.2 but ArgoCD deployed 86.3.1)
# =============================================================================

prometheus:
  prometheusSpec:
    retention: 15d
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

grafana:
  # Leave empty to auto-generate password (stored in Secret: prometheus-grafana)
  # Or set via SealedSecret in security/secrets/ (Phase 5)
  adminPassword: ""
  persistence:
    enabled: true
    size: 10Gi
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
      searchNamespace: ALL
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
      - grafana.homelab.local
    tls:
      - hosts:
          - grafana.homelab.local
        secretName: grafana-tls
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi

prometheusOperator:
  admissionWebhooks:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Disable cluster components that aren't available or managed externally
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# Enable useful targets
kubelet:
  enabled: true
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
coreDns:
  enabled: true
kubeDns:
  enabled: false

# Scrape Cilium and Hubble metrics
additionalScrapeConfigs:
  - job_name: 'cilium-agent'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - kube-system
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_k8s_app]
        action: keep
        regex: cilium
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: metrics
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

  - job_name: 'cilium-operator'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - kube-system
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_io_cilium_app]
        action: keep
        regex: operator
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: metrics
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

  - job_name: 'hubble-relay'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - kube-system
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_k8s_app]
        action: keep
        regex: hubble-relay
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: metrics
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

# =============================================================================
# Filesystem alert handling (tmpfs /run pressure)
# =============================================================================
# The chart default `NodeFilesystemAlmostOutOfSpace` rule (critical, 30m) and
# `NodeFilesystemSpaceFillingUp` (warning) fire on tmpfs /run because:
#   1. /run is sized at 10% of RAM by systemd default (~385 MB on minipc).
#   2. K3s containerd creates a 64 MiB shm tmpfs per sandbox in /run.
#
# We do NOT override these chart defaults here. The permanent fix is at
# the node level via Ansible (see ansible/roles/bootstrap-node/):
#   - Layer 1: tmp.mount drop-in scales /run to 25% of RAM.
#   - Layer 2: K3s kubelet-arg pod-shm-size reduces per-sandbox shm to 32 MiB.
#
# Our custom alert at observability/rules/node-alerts.yaml:48 (NodeDiskPressure)
# already filters fstype!="tmpfs" for the root filesystem, which is what humans
# actually need to be paged on. Volatile tmpfs pressure resolves on pod restart
# and is not paging-worthy.
# =============================================================================
